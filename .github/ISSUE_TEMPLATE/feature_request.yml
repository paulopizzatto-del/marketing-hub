name: Sugerir melhoria
description: Proponha um recurso ou ajuste editorial
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema você quer resolver?
      description: Diga o caso de uso antes de sugerir a solução.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Qual seria uma boa solução?
  - type: checkboxes
    id: safety
    attributes:
      label: Revisão
      options:
        - label: A proposta não depende de dados privados de clientes.
