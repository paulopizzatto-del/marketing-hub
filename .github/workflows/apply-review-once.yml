name: Apply reviewed corrections (temporary)
on:
  push:
    branches: ['fix/claude-review-2.3.1']
    paths: ['.maintenance/READY', '.github/workflows/apply-review-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'paulopizzatto-del/marketing-hub' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Apply exact reviewed patch
        run: python .maintenance/apply_review.py
      - name: Validate corrected source
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/sync_version.py --check
          python scripts/check_repo.py
          python skills/marketinghub/scripts/validate_brand_profile.py --require-full examples/brand-profile-ficticio.json
          python -m unittest discover -s tests -v
          python scripts/build_release.py
      - name: Commit corrected source on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'fix: implement independent review corrections for 2.3.1'
          git push origin HEAD:fix/claude-review-2.3.1
