name: Review source snapshot (temporary)
on:
  push:
    branches: ['fix/claude-review-2.3.1']
    paths: ['.github/workflows/review-source-once.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f5f82a84ab62a06bb2eb996d4d68201832c56281
          persist-credentials: false
      - name: Export reviewed commit without git history
        run: git archive --format=zip --output=review-source.zip HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-f5f82a8
          path: review-source.zip
          retention-days: 1
