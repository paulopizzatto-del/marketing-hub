name: Create Marketing Hub v2.4.2 tag
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tag-marketinghub-2.4.2.yml']
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 88cdb3ed650538e18e03076eef35030b32224ee5
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Revalidate pinned source
        run: |
          test "$(git rev-parse HEAD)" = "88cdb3ed650538e18e03076eef35030b32224ee5"
          test "$(cat VERSION)" = '2.4.2'
          python -m pip install -r requirements-dev.txt
          python scripts/check_repo.py
          python -m unittest discover -s tests -q
          python scripts/build_release.py
          git diff --check
      - name: Tag validated source for existing release pipeline
        run: |
          if git ls-remote --tags origin 'refs/tags/v2.4.2' | grep -q 'refs/tags/v2.4.2'; then
            echo 'Refusing overwrite of existing v2.4.2 tag'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v2.4.2 -m 'Marketing Hub 2.4.2 - public launch documentation' 88cdb3ed650538e18e03076eef35030b32224ee5
          git push origin refs/tags/v2.4.2
