name: Bootstrap beta release
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  publish-beta:
    if: "${{ github.event.issue.title == 'marketinghub: release v2.3.0-beta.1' && github.event.issue.user.login == github.repository_owner }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate source
        run: |
          python scripts/check_repo.py
          python -m unittest discover -s tests -v
      - name: Package archives
        run: python scripts/build_release.py
      - name: Publish beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.3.0-beta.1" \
            dist/skill.zip \
            dist/marketing-hub-plugin.zip \
            dist/marketing-hub-repository.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Marketing Hub 2.3.0 — Public Beta" \
            --notes-file docs/lancamento-publico.md \
            --prerelease
