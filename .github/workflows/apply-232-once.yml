name: Apply Marketing Hub 2.3.2 reviewed overlay (temporary)
on:
  push:
    branches: ['release/2.3.2-autoexpert']
    paths: ['.maintenance/overlay-232.b64']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/2.3.2-autoexpert
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Apply reviewed source overlay
        run: |
          set -euo pipefail
          base64 -d .maintenance/overlay-232.b64 > /tmp/overlay-232.tgz
          tar -xzf /tmp/overlay-232.tgz -C .
          rm -rf scripts/__pycache__ skills/marketinghub/scripts/__pycache__ tests/__pycache__ dist
      - name: Verify source
        run: |
          set -euo pipefail
          python -m pip install -r requirements-dev.txt
          python scripts/sync_version.py --check
          python scripts/check_repo.py
          python skills/marketinghub/scripts/validate_brand_profile.py --require-full examples/brand-profile-ficticio.json
          python -m unittest discover -s tests -v
          python scripts/build_release.py
          python scripts/build_release.py
      - name: Commit reviewed 2.3.2 source
        run: |
          set -euo pipefail
          rm -rf .maintenance
          rm -f .github/workflows/apply-232-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare Marketing Hub 2.3.2'
          git push origin HEAD:release/2.3.2-autoexpert
