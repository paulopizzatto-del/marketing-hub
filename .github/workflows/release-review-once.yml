name: Publish review correction 2.3.1 (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-review-once.yml']
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'paulopizzatto-del/marketing-hub' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: acb9e0d98c8c61b02e1de8adc95a67c295774253
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Validate reviewed source
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/sync_version.py --check
          python scripts/check_repo.py
          python skills/marketinghub/scripts/validate_brand_profile.py --require-full examples/brand-profile-ficticio.json
          python -m unittest discover -s tests -v
          python scripts/build_release.py
      - name: Publish corrective release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.3.1 \
            dist/skill.zip \
            dist/marketing-hub-plugin.zip \
            dist/marketing-hub-repository.zip \
            dist/SHA256SUMS.txt \
            --target acb9e0d98c8c61b02e1de8adc95a67c295774253 \
            --title 'Marketing Hub 2.3.1 - Correcoes da revisao independente' \
            --notes-file docs/lancamento-publico.md \
            --latest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: correction-2.3.1-verified-packages
          path: |
            dist/skill.zip
            dist/marketing-hub-plugin.zip
            dist/marketing-hub-repository.zip
            dist/SHA256SUMS.txt
          retention-days: 3
