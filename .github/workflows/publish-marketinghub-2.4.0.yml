name: Publish Marketing Hub 2.4.0 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-marketinghub-2.4.0.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fef2149169cdb7bffdd2c000aed92979d5902772
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Verify source commit and build
        run: |
          test "$(git rev-parse HEAD)" = "fef2149169cdb7bffdd2c000aed92979d5902772"
          test "$(cat VERSION)" = "2.4.0"
          python -m pip install -r requirements-dev.txt
          python scripts/check_repo.py
          python -m unittest discover -s tests -v
          python scripts/build_release.py
      - name: Tag validated source and publish archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags origin 'refs/tags/v2.4.0' | grep -q 'refs/tags/v2.4.0'; then
            echo 'Release tag v2.4.0 already exists; refusing to overwrite'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v2.4.0 -m "Marketing Hub 2.4.0" fef2149169cdb7bffdd2c000aed92979d5902772
          git push origin refs/tags/v2.4.0
          gh release create v2.4.0 --verify-tag --title 'Marketing Hub 2.4.0' \
            --notes 'Studio de briefing local, fluxo editorial estratégico, voz de marca, evidências e protocolo MH-50. O estudo com marcas e avaliadores humanos está planejado; ainda não há demonstração de superioridade editorial.' \
            dist/skill.zip dist/marketing-hub-plugin.zip dist/marketing-hub-repository.zip dist/SHA256SUMS.txt
