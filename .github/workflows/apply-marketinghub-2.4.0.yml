name: Apply staged Marketing Hub 2.4.0
on:
  push:
    branches: [release/v2.4.0-staging]
    paths:
      - '.release_payload/READY'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Verify payload and apply 2.4.0 source
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, shutil, zlib
          root = pathlib.Path('.').resolve()
          files = sorted(pathlib.Path('.release_payload').glob('part*.b64'))
          assert len(files) == 10, f'Expected 10 chunks, got {len(files)}'
          payload = base64.b64decode(''.join(p.read_text().strip() for p in files), validate=True)
          assert hashlib.sha256(payload).hexdigest() == '2b6b66784eb3ea4422f6c43a7ceeb02d37d6503181e4b6ef4caf0b23c27e72af'
          data = json.loads(zlib.decompress(payload).decode('utf-8'))
          assert len(data) == 44
          for name, text in data.items():
              target = (root / name).resolve()
              assert target.is_relative_to(root) and target != root
              assert isinstance(text, str)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text, encoding='utf-8')
          assert pathlib.Path('VERSION').read_text().strip() == '2.4.0'
          shutil.rmtree('.release_payload')
          pathlib.Path('.github/workflows/apply-marketinghub-2.4.0.yml').unlink()
          print('Applied',len(data),'source files with verified SHA256')
          PY
      - name: Test reconstructed release
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/check_repo.py
          python -m unittest discover -s tests -q
          python scripts/build_release.py
          sed -i 's/[[:blank:]]*$//' docs/publicacao-no-github.md
          git diff --check
      - name: Commit source without temporary payload
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: release Marketing Hub 2.4.0 (Studio, editorial workflows, MH-50)"
          git push origin HEAD:release/v2.4.0-staging
