name: Package release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate source
        run: |
          python scripts/check_repo.py
          python -m unittest discover -s tests -v
      - name: Build deterministic archives
        run: python scripts/build_release.py
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            dist/skill.zip \
            dist/marketing-hub-plugin.zip \
            dist/marketing-hub-repository.zip \
            dist/SHA256SUMS.txt "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: marketing-hub-zips
          path: |
            dist/skill.zip
            dist/marketing-hub-plugin.zip
            dist/marketing-hub-repository.zip
            dist/SHA256SUMS.txt
