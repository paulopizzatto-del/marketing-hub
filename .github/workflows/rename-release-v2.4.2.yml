name: Standardize MarketingHub release title
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-release-v2.4.2.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Set exact public release name
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: paulopizzatto-del/marketing-hub
        shell: bash
        run: |
          gh release edit v2.4.2 --repo "$GH_REPO" --title 'MarketingHub v2.4.2'
          actual="$(gh api "repos/$GH_REPO/releases/tags/v2.4.2" --jq '.name')"
          test "$actual" = 'MarketingHub v2.4.2'
          echo "Verified release title: $actual"
