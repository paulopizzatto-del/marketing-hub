name: Export current Marketing Hub for Claude (temporary)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-claude-once.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 76f29c2372076c5c86db9b7283af22586d28eb67
          persist-credentials: false
      - name: Build Claude review package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/MarketingHub_Atual_Claude/fonte_atual_main"
          cp -a . "$RUNNER_TEMP/MarketingHub_Atual_Claude/fonte_atual_main/"
          rm -rf "$RUNNER_TEMP/MarketingHub_Atual_Claude/fonte_atual_main/.git"
          cat > "$RUNNER_TEMP/MarketingHub_Atual_Claude/README_CLAUDE.md" <<'EOF'
          # Marketing Hub — pacote atual para reavaliação independente

          Este pacote contém o estado atual auditável do Marketing Hub na branch main, commit 76f29c2372076c5c86db9b7283af22586d28eb67.

          ## Leia primeiro

          - fonte_atual_main/README.md
          - fonte_atual_main/skills/marketinghub/SKILL.md
          - fonte_atual_main/docs/revisao-2.3.1.md
          - fonte_atual_main/docs/autoavaliacao-2.3.1.md
          - fonte_atual_main/evaluation/pilot-144/PLAN.md
          - fonte_atual_main/CHANGELOG.md
          - fonte_atual_main/VERSION
          - PROMPT_REAVALIACAO_CLAUDE.md

          ## Contexto

          A revisão anterior da v2.3.0 encontrou problemas reais: ausência de evidência comparativa, apresentação com promessas acima da evidência, procedência de artes mal descrita, avaliador frágil, pacote inchado, conflito de idioma, redundância de proibições e falta de exemplos trabalhados.

          A versão 2.3.1 corrigiu esses itens técnicos e de apresentação. O piloto comparativo de 144 saídas reais com avaliação humana cega ainda não foi executado.

          O objetivo agora é uma nova revisão independente: confirmar o que foi corrigido, tentar encontrar regressões e apontar o que ainda impediria uma divulgação maior.
          EOF
          cat > "$RUNNER_TEMP/MarketingHub_Atual_Claude/PROMPT_REAVALIACAO_CLAUDE.md" <<'EOF'
          # Reavaliação independente do Marketing Hub — estado atual

          Avalie o conteúdo completo da pasta `fonte_atual_main/`. Não presuma que as correções estão corretas só porque foram feitas em resposta ao seu parecer anterior.

          ## Objetivo

          Produzir uma auditoria independente, crítica e reproduzível do Marketing Hub 2.3.1 e do estado atual da main.

          ## Regras

          1. Diferencie fato verificado, inferência, hipótese e recomendação.
          2. Rode testes e scripts antes de opinar sobre engenharia.
          3. Não invente resultados de qualidade editorial.
          4. Se você não executar a skill em modelos reais, diga explicitamente que não mediu qualidade de texto.
          5. Reavalie todos os problemas da revisão anterior: evidência, posicionamento, banner/social preview, procedência das artes, avaliador, idioma, pacote instalado, versão, redundância de prompts, dados de clientes, segurança e coerência documental.
          6. Tente encontrar falsos positivos e falsos negativos novos no avaliador.
          7. Avalie se o fluxo "cole 3 posts → cartão de voz → nova peça/revisão" está de fato melhor especificado.
          8. Verifique se o pacote instalado contém apenas o necessário e se o build é determinístico.
          9. Verifique coerência entre README, SKILL.md, referências, scripts, testes e docs.
          10. Não trate release oficial, CI verde ou testes de software como prova de superioridade editorial.

          ## Testes mínimos

          - `python scripts/check_repo.py`
          - `python -m unittest discover -s tests -v`
          - `python scripts/build_release.py`
          - Conferir VERSION e manifests
          - Conferir tamanho e conteúdo de dist/skill.zip
          - Testar scripts/evaluate_model_outputs.py com:
            - LinkedIn longo e legítimo
            - inglês correto sem palavras dos fixtures antigos
            - alegação percentual sem evidência
            - credencial sintética
            - contaminação entre marcas
            - saída vazia/incompleta
          - Confirmar que os testes de 20 marcas/60 textos estão apresentados só como contrato interno
          - Confirmar que nenhuma arte ou texto promocional promete compatibilidade não demonstrada

          ## Questão central a tentar falsificar

          > "O Marketing Hub 2.3.1 tornou-se um kit mais coerente e seguro de conteúdo/social media, mas ainda precisa demonstrar valor incremental sobre uma IA competente com o mesmo briefing e as mesmas amostras."

          Se conseguir refutar, explique com evidência. Se não, diga exatamente o que falta.

          ## Formato da resposta

          A. Veredito executivo atual
          B. Top 10 problemas atuais, com gravidade, evidência, consequência, correção e teste de aceite
          C. Top 10 oportunidades atuais
          D. Arquitetura recomendada depois da 2.3.1
          E. Revisão das capacidades e dos antigos 17 métodos
          F. Revisão dos prompts e exemplos de voz
          G. Revisão do benchmark/piloto de 144 saídas
          H. Plano das próximas 3 releases
          I. Propostas técnicas concretas
          J. Conclusão crítica: divulgar mais agora, manter divulgação atual, ou recuar?

          Termine com uma seção curta: **O que eu mudaria antes da próxima divulgação**, em ordem de prioridade.
          EOF
          (cd "$RUNNER_TEMP/MarketingHub_Atual_Claude" && find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST_SHA256.txt)
          (cd "$RUNNER_TEMP" && zip -qr MarketingHub_Atual_Claude.zip MarketingHub_Atual_Claude)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MarketingHub-Atual-para-Claude
          path: ${{ runner.temp }}/MarketingHub_Atual_Claude.zip
          retention-days: 3
