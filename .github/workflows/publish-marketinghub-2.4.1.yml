name: Publish Marketing Hub v2.4.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-marketinghub-2.4.1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: a27712135e5a73e19aeeb40501521b864352b0f6
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Validate pinned source and build archives
        run: |
          test "$(git rev-parse HEAD)" = "a27712135e5a73e19aeeb40501521b864352b0f6"
          test "$(cat VERSION)" = "2.4.1"
          python -m pip install -r requirements-dev.txt
          python scripts/check_repo.py
          python -m unittest discover -s tests -q
          python scripts/build_release.py
          git diff --check
      - name: Create immutable patch tag and publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git ls-remote --tags origin 'refs/tags/v2.4.1' | grep -q 'refs/tags/v2.4.1'; then
            echo 'Tag v2.4.1 already exists; refusing overwrite.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v2.4.1 -m 'Marketing Hub 2.4.1: pt-BR proofreading' a27712135e5a73e19aeeb40501521b864352b0f6
          git push origin refs/tags/v2.4.1
          gh release create v2.4.1 --verify-tag --latest --title 'Marketing Hub 2.4.1 — revisão ortográfica' \
            --notes 'Atualização de manutenção: revisão do português brasileiro na documentação, no Studio, nos exemplos e nas mensagens dos validadores. Mantém os fluxos do Marketing Hub 2.4, as atribuições e a estrutura de dados. Testes automatizados passaram; não há novas alegações de superioridade editorial.' \
            dist/skill.zip dist/marketing-hub-plugin.zip dist/marketing-hub-repository.zip dist/SHA256SUMS.txt
