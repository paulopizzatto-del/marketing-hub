name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Essential validator without third-party packages
        run: python -S skills/marketinghub/scripts/validate_brand_profile.py examples/brand-profile-ficticio.json
      - name: Install pinned full-schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Full schema validation (required, no fallback)
        run: python skills/marketinghub/scripts/validate_brand_profile.py --require-full examples/brand-profile-ficticio.json
      - name: Structural validation and provenance
        run: python scripts/check_repo.py
      - name: Automated tests
        run: python -m unittest discover -s tests -v
      - name: Packaging integrity
        run: python scripts/build_release.py
