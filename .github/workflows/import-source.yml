name: Importar Marketing Hub (temporario)
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: write
jobs:
  import-source:
    if: "github.event.issue.title == 'marketinghub: import audited source'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar pacote privado e conferir integridade
        env:
          TRANSFER_URL: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 "$TRANSFER_URL" -o "$RUNNER_TEMP/plugin.tar.gz"
          mkdir -p "$RUNNER_TEMP/plugin" "$RUNNER_TEMP/import"
          tar -xzf "$RUNNER_TEMP/plugin.tar.gz" -C "$RUNNER_TEMP/plugin"
          test -f "$RUNNER_TEMP/plugin/assets/github-source-bundle.zip"
          echo "dff433918a6b4a8dc21ff03a206a527a6ae1f033eae4f22892565f5ee8bf71c9  $RUNNER_TEMP/plugin/assets/github-source-bundle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/plugin/assets/github-source-bundle.zip" -d "$RUNNER_TEMP/import"
          test -f "$RUNNER_TEMP/import/marketing-hub/README.md"
          cp -a "$RUNNER_TEMP/import/marketing-hub/." .
          rm -f .github/workflows/import-source.yml
      - name: Validar fontes e identidade visual
        run: |
          python scripts/check_repo.py
          python -m unittest discover -s tests -v
      - name: Publicar fontes na branch principal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          git commit -m 'feat: import Marketing Hub 2.2.1 audited repository'
          git push origin HEAD:main
